<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Check-In">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Location Check-In System</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 { margin-top: 0; color: #2c3e50; font-size: 22px; margin-bottom: 16px; }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      background-color: #e8f4fd;
      color: #1e88e5;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #546e7a; margin-bottom: 6px; }
    select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #cfd8dc;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }
    select:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.15); }
    .btn-submit {
      background-color: #1e88e5;
      color: #ffffff;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover { background-color: #1565c0; }
    .btn-submit:disabled { background-color: #b0bec5; cursor: not-allowed; }
    .locked-card {
      background-color: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 18px;
      font-size: 15px;
      text-align: center;
    }
    .install-tip {
      display: none;
      background: #fff8e1;
      border: 1px solid #ffe082;
      color: #8d6e00;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
      margin-bottom: 18px;
    }
    .loading-spinner { display: none; margin-top: 12px; color: #78909c; font-size: 13px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; padding: 20px;
    }
    .modal-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: modalPop 0.2s ease-out;
    }
    @keyframes modalPop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-body { font-size: 15px; color: #2c3e50; margin-bottom: 20px; white-space: pre-line; line-height: 1.5; }
    .modal-btn {
      background-color: #1e88e5; color: #ffffff; border: none;
      padding: 10px 24px; border-radius: 8px; font-weight: bold; font-size: 15px;
      cursor: pointer; width: 100%;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 Location Check-In</h2>

  <div id="statusBadge" class="status-badge">Identifying device...</div>

  <!-- iPhone 提示：請先加入主畫面再綁定 -->
  <div id="installTip" class="install-tip">
    <b>iPhone users:</b> Before your first check-in, tap the Share button
    (<b>⬆︎</b>) → <b>Add to Home Screen</b>, then open the app from the new icon
    to bind your phone.
  </div>

  <div id="boundNameDisplay" class="locked-card" style="display: none;"></div>

  <div id="nameSelectGroup" class="form-group" style="display: none;">
    <label for="empSelect">Select Your Name (Will bind to this device on first check-in):</label>
    <select id="empSelect">
      <option value="">-- Select Your Name --</option>
    </select>
  </div>

  <div class="form-group">
    <label for="checkTypeSelect">Action:</label>
    <select id="checkTypeSelect">
      <option value="Clock-In">Clock-In</option>
      <option value="Clock-Out">Clock-Out</option>
    </select>
  </div>

  <div class="form-group">
    <label for="locationSelect">Location:</label>
    <select id="locationSelect">
      <option value="Shop">Shop</option>
      <option value="Main Kitchen">Main Kitchen</option>
      <option value="SA">SA</option>
    </select>
  </div>

  <button id="btnCheckIn" class="btn-submit" onclick="submitCheckIn()" disabled>Checking Connection...</button>

  <div id="loadingText" class="loading-spinner">⏳ Acquiring GPS location & verifying, please wait...</div>
</div>

<div id="customModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <div id="modalText" class="modal-body"></div>
    <button class="modal-btn" onclick="closeCustomModal()">OK</button>
  </div>
</div>

<script>
  /* ★★★ 部署 Apps Script 後，把「網頁應用程式網址」貼在這裡 ★★★ */
  var API_URL = "https://script.google.com/macros/s/AKfycbwQYYlc5RYhCXX9ZhDWvL8S6R8uqX1rmhjO0mMrLf47GZa3dAWqWGVQwMOKdmDhvgNRyA/exec";

  var onModalCloseCallback = null;
  var isBound = false;
  var lockedEmpName = "";

  /* ---------- 呼叫後端 API ---------- */
  function api(action, payload) {
    var body = Object.assign({ action: action }, payload || {});
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },  // 避免 CORS preflight
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* ---------- 彈窗 ---------- */
  function showAlert(msg, callback) {
    document.getElementById("modalText").innerText = msg;
    document.getElementById("customModal").style.display = "flex";
    onModalCloseCallback = callback || null;
  }
  function closeCustomModal() {
    document.getElementById("customModal").style.display = "none";
    if (onModalCloseCallback) { var cb = onModalCloseCallback; onModalCloseCallback = null; cb(); }
  }

  /* ---------- 裝置 ID：localStorage + cookie 雙備份 ---------- */
  function readCookie(k) {
    var m = document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : "";
  }
  function newUuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }
  function getDeviceId() {
    var id = "";
    try { id = localStorage.getItem("company_device_id") || ""; } catch (e) {}
    if (!id) id = readCookie("company_device_id");
    if (!id) id = "DEV-" + newUuid();
    try { localStorage.setItem("company_device_id", id); } catch (e) {}
    document.cookie = "company_device_id=" + encodeURIComponent(id) +
                      "; max-age=315360000; path=/; SameSite=Lax; Secure";
    return id;
  }
  var currentDeviceId = getDeviceId();

  /* ---------- iPhone 在 Safari 分頁中開啟時，顯示加入主畫面提示 ---------- */
  (function () {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true ||
                     window.matchMedia("(display-mode: standalone)").matches;
    if (isIOS && !standalone) document.getElementById("installTip").style.display = "block";
  })();

  /* ---------- 名單 ---------- */
  function renderDropdownOptions(names) {
    var select = document.getElementById("empSelect");
    select.innerHTML = '<option value="">-- Select Your Name --</option>';
    names.forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      opt.innerText = name;
      select.appendChild(opt);
    });
  }

  function loadEmployeeList() {
    api("getEmployeeList")
      .then(function (res) {
        if (res && res.success && res.nameList.length > 0) {
          renderDropdownOptions(res.nameList);
        } else if (res && res.success) {
          renderDropdownOptions([]);
          showAlert("No unbound staff names available.\nIf you changed phones, please ask the manager to reset your device.");
        } else {
          showAlert("Unable to load staff list. Please reload the page.");
        }
      })
      .catch(function () {
        showAlert("Network error while loading staff list. Please reload the page.");
      });
  }

  /* ---------- 頁面載入 ---------- */
  window.onload = function () {
    var statusBadge = document.getElementById("statusBadge");
    var btnCheckIn = document.getElementById("btnCheckIn");

    api("checkDeviceBinding", { deviceId: currentDeviceId })
      .then(function (res) {
        if (res && res.isBound) {
          isBound = true;
          lockedEmpName = res.empName;
          document.getElementById("installTip").style.display = "none";
          document.getElementById("nameSelectGroup").style.display = "none";
          document.getElementById("boundNameDisplay").innerText = "👤 Staff: " + res.empName + " (Device Verified)";
          document.getElementById("boundNameDisplay").style.display = "block";
          statusBadge.innerText = "Device Verified";
          statusBadge.style.backgroundColor = "#e8f5e9";
          statusBadge.style.color = "#2e7d32";
        } else {
          isBound = false;
          document.getElementById("nameSelectGroup").style.display = "block";
          document.getElementById("boundNameDisplay").style.display = "none";
          statusBadge.innerText = "First Visit: Select Name to Bind";
          statusBadge.style.backgroundColor = "#fff3e0";
          statusBadge.style.color = "#ef6c00";
          loadEmployeeList();
        }
        btnCheckIn.innerText = "Submit Check-In";
        btnCheckIn.disabled = false;
      })
      .catch(function () {
        statusBadge.innerText = "Connection Error";
        statusBadge.style.backgroundColor = "#ffebee";
        statusBadge.style.color = "#c62828";
        btnCheckIn.innerText = "Reload Page";
        btnCheckIn.disabled = false;
        btnCheckIn.onclick = function () { window.location.reload(); };
        showAlert("Unable to connect to the server. Please check your internet and reload.");
      });
  };

  /* ---------- 打卡 ---------- */
  function resetButton() {
    var btn = document.getElementById("btnCheckIn");
    btn.disabled = false;
    btn.innerText = "Submit Check-In";
    document.getElementById("loadingText").style.display = "none";
  }

  function submitCheckIn() {
    var empName = isBound ? lockedEmpName : document.getElementById("empSelect").value;
    if (!empName) { showAlert("Please select your name first!"); return; }
    if (!navigator.geolocation) { showAlert("This browser does not support GPS location."); return; }

    var checkType = document.getElementById("checkTypeSelect").value;
    var location = document.getElementById("locationSelect").value;
    var btn = document.getElementById("btnCheckIn");

    btn.disabled = true;
    btn.innerText = "Locating & Verifying...";
    document.getElementById("loadingText").style.display = "block";

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        api("processCheckIn", {
          empName: empName,
          location: location,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          deviceId: currentDeviceId,
          checkType: checkType
        })
        .then(function (res) {
          resetButton();
          showAlert(res.message, function () {
            if (res.success && !isBound) window.location.reload();
          });
        })
        .catch(function (err) {
          resetButton();
          showAlert("Check-in failed to submit. Please check your internet and try again.");
        });
      },
      function (err) {
        resetButton();
        var msg = "Unable to acquire GPS location. Please make sure location services are enabled on your device.";
        if (err && err.code === 1) msg = "Location permission was denied.\nPlease allow location access for this app in your phone settings.";
        else if (err && err.code === 3) msg = "GPS timed out. Please move to an open area and try again.";
        showAlert(msg);
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }
</script>

</body>
</html>
