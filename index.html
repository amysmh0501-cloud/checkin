<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Check-In System</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 22px;
      margin-bottom: 16px;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      background-color: #e8f4fd;
      color: #1e88e5;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #546e7a;
      margin-bottom: 6px;
    }
    select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #cfd8dc;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }
    select:focus {
      border-color: #1e88e5;
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.15);
    }
    .btn-submit {
      background-color: #1e88e5;
      color: #ffffff;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background-color: #1565c0;
    }
    .btn-submit:disabled {
      background-color: #b0bec5;
      cursor: not-allowed;
    }
    .locked-card {
      background-color: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 18px;
      font-size: 15px;
      text-align: center;
    }
    .loading-spinner {
      display: none;
      margin-top: 12px;
      color: #78909c;
      font-size: 13px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: modalPop 0.2s ease-out;
    }
    @keyframes modalPop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-body {
      font-size: 15px;
      color: #2c3e50;
      margin-bottom: 20px;
      white-space: pre-line;
      line-height: 1.5;
    }
    .modal-btn {
      background-color: #1e88e5;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 Location Check-In</h2>
  
  <div id="statusBadge" class="status-badge">Identifying device...</div>

  <!-- 1. Displayed after successful device binding -->
  <div id="boundNameDisplay" class="locked-card" style="display: none;"></div>

  <!-- 2. Displayed on first visit (Unbound state) -->
  <div id="nameSelectGroup" class="form-group" style="display: none;">
    <label for="empSelect">Select Your Name (Will bind to this device on first check-in):</label>
    <select id="empSelect">
      <option value="">-- Select Your Name --</option>
    </select>
  </div>

  <!-- Action: Clock-In / Clock-Out Selection -->
  <div class="form-group">
    <label for="checkTypeSelect">Action:</label>
    <select id="checkTypeSelect">
      <option value="Clock-In">Clock-In (上班)</option>
      <option value="Clock-Out">Clock-Out (下班)</option>
    </select>
  </div>

  <!-- Check-in Location Selection -->
  <div class="form-group">
    <label for="locationSelect">Location:</label>
    <select id="locationSelect">
      <option value="Shop">Shop</option>
      <option value="Main Kitchen">Main Kitchen</option>
    </select>
  </div>

  <button id="btnCheckIn" class="btn-submit" onclick="submitCheckIn()" disabled>Checking Connection...</button>

  <div id="loadingText" class="loading-spinner">⏳ Acquiring GPS location & verifying, please wait...</div>
</div>

<!-- Custom URL-Free Alert Modal -->
<div id="customModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <div id="modalText" class="modal-body"></div>
    <button class="modal-btn" onclick="closeCustomModal()">OK</button>
  </div>
</div>

<script>
"use strict";

// ============================================
// 1. API 設定
// ============================================

const API_URL = "YOUR_APPS_SCRIPT_EXEC_URL";

const DEFAULT_NAMES = [
  "Surlaia", "Cliff", "Helen", "Jessinta",
  "Shantel", "Doreen", "Maria", "Amy", "Winston"
];

let onModalCloseCallback = null;
let isBound = false;
let lockedEmpName = "";
let currentDeviceId = "";
let statusBadge = null;
let isSubmitting = false;


// ============================================
// 2. Modal 提示
// ============================================

function showAlert(msg, callback) {
  document.getElementById("modalText").innerText = msg;
  document.getElementById("customModal").style.display = "flex";
  onModalCloseCallback = callback || null;
}

function closeCustomModal() {
  document.getElementById("customModal").style.display = "none";

  if (onModalCloseCallback) {
    const callback = onModalCloseCallback;
    onModalCloseCallback = null;
    callback();
  }
}


// ============================================
// 3. 裝置 ID
// 必須沿用原本 company_device_id
// ============================================

function getDeviceId() {
  let id = localStorage.getItem("company_device_id");

  if (!id) {
    if (!crypto.randomUUID) {
      throw new Error("This browser cannot generate a device ID.");
    }

    id = "DEV-" + crypto.randomUUID();
    localStorage.setItem("company_device_id", id);
  }

  return id;
}


// ============================================
// 4. 員工下拉選單
// ============================================

function renderDropdownOptions(names) {
  const select = document.getElementById("empSelect");

  if (!select) {
    console.error("Missing element: empSelect");
    return;
  }

  select.innerHTML = '<option value="">-- Select Your Name --</option>';

  names.forEach(function(name) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.innerText = name;
    select.appendChild(opt);
  });
}

async function loadEmployeeList() {
  try {
    const url = new URL(API_URL);
    url.searchParams.set("action", "getEmployeeList");

    const response = await fetch(url.toString());

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const result = await response.json();

    let names = [];

    if (Array.isArray(result)) {
      names = result;
    } else if (result && Array.isArray(result.nameList)) {
      names = result.nameList;
    }

    renderDropdownOptions(
      names.length > 0 ? names : DEFAULT_NAMES
    );

  } catch (error) {
    console.error("Load employee list failed:", error);
    renderDropdownOptions(DEFAULT_NAMES);
  }
}


// ============================================
// 5. 檢查裝置綁定
// ============================================

async function verifyCurrentDevice(deviceId) {
  const nameGroup = document.getElementById("nameSelectGroup");
  const boundDisplay = document.getElementById("boundNameDisplay");

  try {
    const url = new URL(API_URL);
    url.searchParams.set("action", "checkDeviceBinding");
    url.searchParams.set("deviceId", deviceId);

    const response = await fetch(url.toString());

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const result = await response.json();

    if (result && result.isBound) {
      isBound = true;
      lockedEmpName = result.empName;

      nameGroup.style.display = "none";

      boundDisplay.innerText =
        "👤 Staff: " + result.empName + " (Device Verified)";
      boundDisplay.style.display = "block";

      statusBadge.innerText = "Device Verified";
      statusBadge.style.backgroundColor = "#e8f5e9";
      statusBadge.style.color = "#2e7d32";

    } else {
      isBound = false;
      lockedEmpName = "";

      nameGroup.style.display = "block";
      boundDisplay.style.display = "none";

      statusBadge.innerText = "First Visit: Select Name to Bind";
      statusBadge.style.backgroundColor = "#fff3e0";
      statusBadge.style.color = "#ef6c00";
    }

    return result;

  } catch (error) {
    console.error("Device verification failed:", error);

    isBound = false;
    lockedEmpName = "";

    statusBadge.innerText = "Verification Failed";
    statusBadge.style.backgroundColor = "#ffebee";
    statusBadge.style.color = "#c62828";

    // 驗證失敗時不要允許打卡
    throw error;
  }
}


// ============================================
// 6. 打卡提交
// 需要後端 doPost(e) 支援 processCheckIn
// ============================================

async function submitCheckIn() {
  if (isSubmitting) return;

  const btn = document.getElementById("btnCheckIn");
  const loadingText = document.getElementById("loadingText");

  const empSelect = document.getElementById("empSelect");
  const checkTypeSelect = document.getElementById("checkTypeSelect");
  const locationSelect = document.getElementById("locationSelect");

  // 綁定裝置只能使用後端確認的員工
  const empName = isBound
    ? lockedEmpName
    : empSelect.value;

  if (!empName) {
    showAlert("Please select your name first!");
    return;
  }

  const checkType = checkTypeSelect.value;
  const location = locationSelect.value;

  isSubmitting = true;
  btn.disabled = true;
  btn.innerText = "Locating & Verifying...";

  if (loadingText) loadingText.style.display = "block";

  try {
    // 如果已有裝置綁定，先重新向後端驗證
    const binding = await verifyCurrentDevice(currentDeviceId);

    if (binding && binding.isBound &&
        binding.empName !== empName) {
      throw new Error("Device employee mismatch.");
    }

    await new Promise(function(resolve, reject) {
      if (!navigator.geolocation) {
        reject(new Error("Geolocation is not supported."));
        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }).then(async function(position) {
      const payload = new URLSearchParams({
        action: "processCheckIn",
        empName: empName,
        location: location,
        lat: String(position.coords.latitude),
        lng: String(position.coords.longitude),
        deviceId: currentDeviceId,
        checkType: checkType
      });

      // 注意：Apps Script 後端必須實作對應的 doPost 路由
      const response = await fetch(API_URL, {
        method: "POST",
        body: payload
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const result = await response.json();

      if (!result || result.success !== true) {
        throw new Error(
          result && result.message
            ? result.message
            : "The server did not confirm check-in."
        );
      }

      showAlert(result.message || "Check-in successful!", function() {
        if (result.boundNewDevice) {
          window.location.reload();
        }
      });
    });

  } catch (error) {
    console.error("Check-in failed:", error);

    showAlert(
      error.code === 1
        ? "Location permission denied. Please enable location access."
        : error.code === 3
        ? "Location request timed out. Please try again."
        : "Unable to confirm check-in. Please check your connection and try again."
    );

  } finally {
    isSubmitting = false;
    btn.disabled = false;
    btn.innerText = "Submit Check-In";

    if (loadingText) loadingText.style.display = "none";
  }
}


// ============================================
// 7. 頁面初始化
// ============================================

window.addEventListener("load", async function() {
  statusBadge = document.getElementById("statusBadge");

  try {
    currentDeviceId = getDeviceId();
  } catch (error) {
    console.error("Device ID initialization failed:", error);
    showAlert("Unable to initialize this device. Please use a supported browser.");
    return;
  }

  // 載入員工名單；同時驗證裝置
  await Promise.all([
    loadEmployeeList(),
    verifyCurrentDevice(currentDeviceId).catch(function() {
      // 驗證失敗已由函式顯示狀態
    })
  ]);
});
</script>

</body>
</html>
