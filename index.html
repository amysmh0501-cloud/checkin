<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>定點打卡系統</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; }
    .card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    h2 { margin-top: 0; color: #1a73e8; font-size: 22px; }
    .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
    .badge-bound { background-color: #e6f4ea; color: #137333; }
    .badge-unbound { background-color: #feefc3; color: #b06000; }
    .form-group { margin-bottom: 18px; text-align: left; }
    label { font-size: 14px; font-weight: 600; color: #5f6368; display: block; margin-bottom: 6px; }
    select { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 16px; background-color: #fff; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-primary { background-color: #1a73e8; color: white; }
    .btn-success { background-color: #34a853; color: white; margin-bottom: 10px; }
    .btn-warning { background-color: #ea4335; color: white; }
    .pwa-box { background-color: #e8f0fe; border: 1px solid #aecbfa; border-radius: 10px; padding: 12px; margin-top: 20px; text-align: left; font-size: 13px; color: #174ea6; line-height: 1.5; }
    #loadingView { display: block; color: #666; margin: 20px 0; }
    .error-msg { background-color: #fce8e6; border: 1px solid #fad2cf; color: #c5221f; padding: 12px; border-radius: 8px; text-align: left; font-size: 13px; line-height: 1.5; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 定點打卡系統</h2>
  <div id="statusBadge" class="badge badge-unbound">系統載入中...</div>

  <!-- 1. 載入與錯誤訊息區塊 -->
  <div id="loadingView">
    <p>正在連線後端伺服器並驗證裝置...</p>
  </div>

  <!-- 2. 未綁定身分畫面 -->
  <div id="unboundView" style="display: none;">
    <div class="form-group">
      <label for="staffSelect">👤 請選擇您的姓名（首次綁定）：</label>
      <select id="staffSelect">
        <option value="">-- 載入員工名單中... --</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="handleBind()">🔗 完成身分綁定</button>
  </div>

  <!-- 3. 已綁定身分畫面 -->
  <div id="boundView" style="display: none;">
    <div class="form-group" style="text-align: center; margin-bottom: 25px;">
      <span style="font-size: 15px; color: #5f6368;">當前打卡人員</span>
      <div id="empNameDisplay" style="font-size: 24px; font-weight: bold; color: #202124; margin-top: 5px;">-</div>
    </div>

    <button class="btn btn-success" onclick="handleCheckIn('Check-in')">☀️ 上班打卡 (Clock-In)</button>
    <button class="btn btn-warning" onclick="handleCheckIn('Check-out')">🌙 下班打卡 (Clock-Out)</button>
  </div>

  <!-- iOS 主畫面提示 -->
  <div id="pwaNotice" class="pwa-box" style="display: none;">
    💡 <strong>提示：</strong>建議點選 Safari 下方分享按鈕 ➔ 選擇 <b>「新增至主畫面」</b>，日後可像 App 一樣快捷打卡！
  </div>
</div>

<script>
  // 後端 Web App 正確部署網址
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxS59p5sHneGR8KVEXAnA63wi8dcCVM81yjbzPCdDEOCH6KKwq8eWfwgoMRWQHZypTR/exec";
  
  // 防偽驗證暗號 (與後端 程式碼.gs 的 clientAppCode 保持一致)
 const clientAppCode = "MK2026_Auth_888";

  let currentDeviceId = "";
  let currentEmpName = "";

  // 取得或生成裝置 UUID (儲存在 LocalStorage)
  function getDeviceId() {
    let id = localStorage.getItem('company_device_id');
    if (!id || id.trim() === "") {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        id = 'DEV-' + crypto.randomUUID();
      } else {
        id = 'DEV-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 8);
      }
      localStorage.setItem('company_device_id', id);
    }
    return id;
  }

 // 通用 API 發送函式 (包含 302 轉址跟隨與 UTF-8 編碼防護)
  function fetchAPI(payload) {
    payload.appCode = clientAppCode;

   // 通用 API 發送函式（極簡 POST 模式，防止 Chrome 302 轉址攔截 CORS）
  function fetchAPI(payload) {
    payload.appCode = clientAppCode;

    return fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => {
      if (!res.ok) {
        throw new Error("HTTP 狀態碼異常: " + res.status);
      }
      return res.json();
    });
  }
  
 // 頁面初始化驗證邏輯
  function initApp() {
    var deviceId = getDeviceId(); // 取得或產生裝置識別碼
    
    fetchAPI({ action: 'checkBinding', deviceId: currentDeviceId })
      .then(res => {
        // 1. 隱藏載入中畫面
        document.getElementById("loadingView").style.display = "none";
        
        console.log("【除錯】checkBinding 後端回應：", res);

        // 2. 檢查後端是否成功回應
        if (res && res.success !== false) {
          // 3. 同時支援 isBound 與 bound 屬性名稱
          if (res.isBound || res.bound) {
            currentEmpName = res.empName;
            document.getElementById("statusBadge").className = "badge badge-bound";
            document.getElementById("statusBadge").innerText = "已安全綁定裝置";
            document.getElementById("empNameDisplay").innerText = res.empName;
            document.getElementById("boundView").style.display = "block";
          } else {
            document.getElementById("statusBadge").className = "badge badge-unbound";
            document.getElementById("statusBadge").innerText = "尚未綁定裝置";
            document.getElementById("unboundView").style.display = "block";
            loadStaffList(); // 載入員工下拉選單
          }
        } else {
          // 後端回傳失敗（例如試算表分頁名稱不對）
          showError("後端驗證失敗：" + (res ? res.message : "未收到回應內容"));
        }
        
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
          document.getElementById("pwaNotice").style.display = "block";
        }
      })
      .catch(err => {
        showError("無法連線至打卡後端：" + (err.message || err));
      });
    
  // 載入員工名單
  function loadStaffList() {
    fetchAPI({ action: 'getStaffList' })
      .then(res => {
        if (res.success && res.staffList) {
          const select = document.getElementById("staffSelect");
          select.innerHTML = '<option value="">-- 請選擇員工 --</option>';
          res.staffList.forEach(emp => {
            const opt = document.createElement("option");
            opt.value = emp.name;
            opt.innerText = emp.name + (emp.dept ? " (" + emp.dept + ")" : "");
            select.appendChild(opt);
          });
        } else {
          showError(res.message || "讀取員工名單失敗");
        }
      })
      .catch(err => {
        showError("載入員工名單失敗：" + (err.message || err));
      });
  }

  // 處理身分綁定
  function handleBind() {
    const selectedEmp = document.getElementById("staffSelect").value;
    if (!selectedEmp) { alert("請先選擇您的姓名！"); return; }
    
    showLoading("正在將裝置與身分進行安全綁定...");
    fetchAPI({ action: 'bind', empName: selectedEmp, deviceId: currentDeviceId })
      .then(res => {
        if (res.success) {
          alert(res.message);
          location.reload();
        } else {
          hideLoading();
          alert(res.message);
        }
      })
      .catch(err => { 
        hideLoading(); 
        alert("綁定失敗：" + (err.message || err)); 
      });
  }

  // 處理打卡
  function handleCheckIn(checkType) {
    showLoading("正在記錄打卡數據...");
    
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => submitCheckIn(checkType, pos.coords.latitude, pos.coords.longitude),
        err => submitCheckIn(checkType, "", ""),
        { timeout: 5000 }
      );
    } else {
      submitCheckIn(checkType, "", "");
    }
  }

  function submitCheckIn(checkType, lat, lng) {
    fetchAPI({
      action: 'checkIn',
      empName: currentEmpName,
      checkType: checkType,
      location: "Main Kitchen",
      lat: lat,
      lng: lng,
      deviceId: currentDeviceId
    })
    .then(res => {
      hideLoading();
      if (res.success) {
        alert(res.message + "\n打卡時間：" + res.time);
      } else {
        alert(res.message);
      }
    })
    .catch(err => { 
      hideLoading(); 
      alert("打卡失敗：" + (err.message || err)); 
    });
  }

  function showLoading(msg) {
    document.getElementById("loadingView").style.display = "block";
    document.getElementById("loadingView").innerHTML = "<p>" + msg + "</p>";
    document.getElementById("unboundView").style.display = "none";
    document.getElementById("boundView").style.display = "none";
  }

  function hideLoading() {
    document.getElementById("loadingView").style.display = "none";
    if (currentEmpName) {
      document.getElementById("boundView").style.display = "block";
    } else {
      document.getElementById("unboundView").style.display = "block";
    }
  }

  function showError(msg) {
    document.getElementById("loadingView").style.display = "block";
    document.getElementById("loadingView").innerHTML = 
      '<div class="error-msg">❌ <strong>連線或伺服器異常：</strong></div>';
    document.getElementById("unboundView").style.display = "none";
    document.getElementById("boundView").style.display = "none";
  }
 }
</script>

</body>
</html>
