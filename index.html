<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Check-In System</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 22px;
      margin-bottom: 16px;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      background-color: #e8f4fd;
      color: #1e88e5;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #546e7a;
      margin-bottom: 6px;
    }
    select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #cfd8dc;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }
    select:focus {
      border-color: #1e88e5;
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.15);
    }
    .btn-submit {
      background-color: #1e88e5;
      color: #ffffff;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background-color: #1565c0;
    }
    .btn-submit:disabled {
      background-color: #b0bec5;
      cursor: not-allowed;
    }
    .locked-card {
      background-color: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 18px;
      font-size: 15px;
      text-align: center;
    }
    .loading-spinner {
      display: none;
      margin-top: 12px;
      color: #78909c;
      font-size: 13px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: modalPop 0.2s ease-out;
    }
    @keyframes modalPop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-body {
      font-size: 15px;
      color: #2c3e50;
      margin-bottom: 20px;
      white-space: pre-line;
      line-height: 1.5;
    }
    .modal-btn {
      background-color: #1e88e5;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 Location Check-In</h2>
  
  <div id="statusBadge" class="status-badge">Identifying device...</div>

  <!-- 1. Displayed after successful device binding -->
  <div id="boundNameDisplay" class="locked-card" style="display: none;"></div>

  <!-- 2. Displayed on first visit (Unbound state) -->
  <div id="nameSelectGroup" class="form-group" style="display: none;">
    <label for="empSelect">Select Your Name (Will bind to this device on first check-in):</label>
    <select id="empSelect">
      <option value="">-- Select Your Name --</option>
    </select>
  </div>

  <!-- Action: Clock-In / Clock-Out Selection -->
  <div class="form-group">
    <label for="checkTypeSelect">Action:</label>
    <select id="checkTypeSelect">
      <option value="Clock-In">Clock-In (上班)</option>
      <option value="Clock-Out">Clock-Out (下班)</option>
    </select>
  </div>

  <!-- Check-in Location Selection -->
  <div class="form-group">
    <label for="locationSelect">Location:</label>
    <select id="locationSelect">
      <option value="Shop">Shop</option>
      <option value="Main Kitchen">Main Kitchen</option>
    </select>
  </div>

  <button id="btnCheckIn" class="btn-submit" onclick="submitCheckIn()" disabled>Checking Connection...</button>

  <div id="loadingText" class="loading-spinner">⏳ Acquiring GPS location & verifying, please wait...</div>
</div>

<!-- Custom URL-Free Alert Modal -->
<div id="customModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <div id="modalText" class="modal-body"></div>
    <button class="modal-btn" onclick="closeCustomModal()">OK</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwQYYlc5RYhCXX9ZhDWvL8S6R8uqX1rmhjO0mMrLf47GZa3dAWqWGVQwMOKdmDhvgNRyA/exec";

fetch(`${API_URL}?action=ping`)
  .then(async (response) => {
    console.log("HTTP status:", response.status);
    console.log("Response URL:", response.url);
    console.log("Response:", await response.text());
  })
  .catch((error) => {
    console.error("API connection failed:", error);
  });
  
  var DEFAULT_NAMES = ["Surlaia", "Cliff", "Helen", "Jessinta", "Shantel", "Doreen", "Maria", "Amy", "Winston"];
  var onModalCloseCallback = null;

  function showAlert(msg, callback) {
    document.getElementById("modalText").innerText = msg;
    document.getElementById("customModal").style.display = "flex";
    onModalCloseCallback = callback || null;
  }

  function closeCustomModal() {
    document.getElementById("customModal").style.display = "none";
    if (onModalCloseCallback) {
      onModalCloseCallback();
      onModalCloseCallback = null;
    }
  }

  function getDeviceId() {
    let id = localStorage.getItem('company_device_id');
    if (!id) {
      id = 'DEV-' + crypto.randomUUID();
      localStorage.setItem('company_device_id', id);
    }
    return id;
  }

  var currentDeviceId = getDeviceId();
  var isBound = false;
  var lockedEmpName = "";

  function renderDropdownOptions(names) {
    var select = document.getElementById("empSelect");
    select.innerHTML = '<option value="">-- Select Your Name --</option>';
    names.forEach(function(name) {
      var opt = document.createElement("option");
      opt.value = name;
      opt.innerText = name;
      select.appendChild(opt);
    });
  }

async function loadEmployeeList() {
  try {
    const url = new URL(API_URL);
    url.searchParams.set("action", "getEmployeeList");

    const response = await fetch(url.toString());

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const res = await response.json();

    let list = [];

    if (Array.isArray(res)) {
      list = res;
    } else if (res && res.success && Array.isArray(res.nameList)) {
      list = res.nameList;
    }

    if (list.length > 0) {
      renderDropdownOptions(list);
    } else {
      renderDropdownOptions(DEFAULT_NAMES);
    }
  } catch (error) {
    console.error("Load employee list failed:", error);
    renderDropdownOptions(DEFAULT_NAMES);
  }
}

async function checkDeviceBinding() {
  try {
    // 改成你原本實際儲存 deviceId 的方式
    const deviceId = localStorage.getItem("deviceId");

    if (!deviceId) {
      isBound = false;
      document.getElementById("nameSelectGroup").style.display = "block";
      document.getElementById("boundNameDisplay").style.display = "none";
      return;
    }

    const url = new URL(API_URL);
    url.searchParams.set("action", "checkDeviceBinding");
    url.searchParams.set("deviceId", deviceId);

    const response = await fetch(url.toString());

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const res = await response.json();

    if (res && res.isBound) {
      isBound = true;
      lockedEmpName = res.empName;

      document.getElementById("nameSelectGroup").style.display = "none";

      document.getElementById("boundNameDisplay").innerText =
        "👤 Staff: " + res.empName + " (Device Verified)";

      document.getElementById("boundNameDisplay").style.display = "block";

      statusBadge.innerText = "Device Verified";
      statusBadge.style.backgroundColor = "#e8f5e9";
      statusBadge.style.color = "#2e7d32";
    } else {
      isBound = false;
      lockedEmpName = "";

      document.getElementById("nameSelectGroup").style.display = "block";
      document.getElementById("boundNameDisplay").style.display = "none";
      statusBadge.innerText = "Device Not Verified";
    }
  } catch (error) {
    console.error("Device binding check failed:", error);
    isBound = false;
    lockedEmpName = "";
    statusBadge.innerText = "Verification Failed";
  }
}

window.addEventListener("load", async function() {
  await Promise.all([
    loadEmployeeList(),
    checkDeviceBinding()
  ]);
});
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.isBound) {
          isBound = true;
          lockedEmpName = res.empName;
          
          document.getElementById("nameSelectGroup").style.display = "none";
          document.getElementById("boundNameDisplay").innerText = "👤 Staff: " + res.empName + " (Device Verified)";
          document.getElementById("boundNameDisplay").style.display = "block";
          
          statusBadge.innerText = "Device Verified";
          statusBadge.style.backgroundColor = "#e8f5e9";
          statusBadge.style.color = "#2e7d32";
        } else {
          isBound = false;
          document.getElementById("nameSelectGroup").style.display = "block";
          document.getElementById("boundNameDisplay").style.display = "none";
          
          statusBadge.innerText = "First Visit: Select Name to Bind";
          statusBadge.style.backgroundColor = "#fff3e0";
          statusBadge.style.color = "#ef6c00";

          loadEmployeeList();
        }

        btnCheckIn.innerText = "Submit Check-In";
        btnCheckIn.disabled = false;
      })
      .withFailureHandler(function(err) {
        document.getElementById("nameSelectGroup").style.display = "block";
        renderDropdownOptions(DEFAULT_NAMES);
        btnCheckIn.innerText = "Submit Check-In";
        btnCheckIn.disabled = false;
      })
      .checkDeviceBinding(currentDeviceId);
  }

  function submitCheckIn() {
    var empName = isBound ? lockedEmpName : document.getElementById("empSelect").value;

    if (!empName) {
      showAlert("Please select your name first!");
      return;
    }

    var checkType = document.getElementById("checkTypeSelect").value;
    var location = document.getElementById("locationSelect").value;
    var btnCheckIn = document.getElementById("btnCheckIn");
    var loadingText = document.getElementById("loadingText");

    btnCheckIn.disabled = true;
    btnCheckIn.innerText = "Locating & Verifying...";
    loadingText.style.display = "block";

    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var lat = pos.coords.latitude;
        var lng = pos.coords.longitude;

        google.script.run
          .withSuccessHandler(function(res) {
            btnCheckIn.disabled = false;
            btnCheckIn.innerText = "Submit Check-In";
            loadingText.style.display = "none";

            showAlert(res.message, function() {
              if (res.success && !isBound) {
                window.location.reload();
              }
            });
          })
          .withFailureHandler(function(err) {
            btnCheckIn.disabled = false;
            btnCheckIn.innerText = "Submit Check-In";
            loadingText.style.display = "none";
            showAlert("Check-in failed to submit: " + err);
          })
          .processCheckIn(empName, location, lat, lng, currentDeviceId, checkType);
      },
      function(err) {
        btnCheckIn.disabled = false;
        btnCheckIn.innerText = "Submit Check-In";
        loadingText.style.display = "none";
        showAlert("Unable to acquire GPS location. Please make sure location services are enabled on your device.");
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  }
</script>

</body>
</html>
